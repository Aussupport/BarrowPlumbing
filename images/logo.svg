<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Shield / Badge background -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0f2b48"/>
    <!-- Water droplet & Flame / Wrench motif -->
    <path d="M32 12 C26 21 20 28 20 37 C20 44.5 25.4 50 32 50 C38.6 50 44 44.5 44 37 C44 28 38 21 32 12 Z" fill="url(#primaryGrad)"/>
    <path d="M32 24 C28.5 29 25 33 25 39 C25 43.5 28.2 47 32 47 C35.8 47 39 43.5 39 39 C39 33 35.5 29 32 24 Z" fill="url(#warmGrad)" opacity="0.9"/>
    <!-- Small pipe / droplet core -->
    <circle cx="32" cy="38" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <g transform="translate(86, 20)">
    <!-- Brand Name -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#0f2b48" letter-spacing="-0.5">BARROW</text>
    <!-- Tagline / Trade -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7" letter-spacing="2.2">PLUMBING &amp; HEATING</text>
  </g>
</svg>
